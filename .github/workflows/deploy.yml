name: EX05 - GitHub Actions CI/CD Pipeline

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn clean test

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP settings (Must be configured in GitHub Secrets)
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Build Failed: ${{ github.repository }} [${{ github.sha }}]"
          body: |
            Build failed for commit ${{ github.sha }}.
            Author: ${{ github.event.head_commit.author.name }} (${{ github.event.head_commit.author.email }})
            
            View result: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: srengty@gmail.com,${{ github.event.head_commit.author.email }}
          from: GitHub Actions CI

  deploy:
    name: Deploy to Web Server
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible and SSHPass
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible sshpass

      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory.ini playbook.yml
