server.port=8081
spring.application.name=idcard-manager

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/idcard_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password= Tcs21@05 // Please replace with your MySQL password

# Hibernate JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Photo Storage Path
idcard.storage.location=uploads

# Thymeleaf cache
spring.thymeleaf.cache=false
